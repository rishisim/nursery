protocol:
  id: synthetic-identifiability-qualification-v8
  schema_version: nursery-synthetic-v8
  status: frozen
  phase: package_qualification_only
  scientific_outcomes_authorized: false
  future_development_authorized: false
  confirmation_authorized: false
  prior_outcomes_authorized: false

