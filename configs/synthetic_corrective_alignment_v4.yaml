design:
  primitive_concepts: 4
  manner_concepts: 3
  action_compositions: 12
  held_out_compositions_per_corpus: 4
  training_repetitions_per_composition: [8, 14]
  candidate_event_count: [3, 5]
  raw_sensor_samples: 224
  event_width: [7, 12]
  event_gap: [4, 10]
  initial_event_start_range: [14, 20]
  background_proposal_start: 112
  correction_challenges_equal_all_grounded_episodes: true
  minimum_present_and_null_episodes_per_training_composition: 1
  speech_anchor_inside_foil_margin_samples: 0.50
  ambiguity_strata: [correction, ambiguous, recoverable]
  grounded_rate_range: [0.58, 0.82]
  foil_rate_by_stratum:
    correction: [0.88, 0.96]
    ambiguous: [0.70, 0.84]
    recoverable: [0.35, 0.55]
  visibility_range: [0.52, 0.90]
  lag_mean_range: [-12.0, 12.0]
  lag_sd_range: [3.0, 8.0]
  side_informativeness_range: [0.65, 0.92]
  side_noise_range: [0.04, 0.14]
  action_geometry:
    rng_namespace: action-geometry-v3
    off_diagonal_mass_range: [0.12, 0.24]
    minimum_self_cross_dot_margin: 0.25
    maximum_generation_attempts: 128
  grounded_sensor_peak_range: [1.6, 2.4]
  null_sensor_peak_range: [1.6, 2.4]
  signed_shift_samples: 13
  conditions: [synchronized, shuffled, shift_minus, shift_plus, absent,
               uninformative, corrupted, oracle_alignment, exact_window]
  negative_controls: [shuffled, shift_minus, shift_plus, absent, uninformative, corrupted]
  primary_comparators: [absent, shuffled]
  exact_window_comparator: exact_window
  positive_control: oracle_alignment
  mechanism_mutations: [semantic_side_zero, evidence_disconnected,
                        within_bag_permuted, old_agreement_gate,
                        semantic_update_disconnected, presence_side_disconnected,
                        null_update_disconnected,
                        null_head_ablation]
  evaluation:
    held_out_instances_per_lexical_concept: 6
    held_out_instances_per_composition: 6
    presence_bags_per_composition: 4
    presence_bag_candidates: 4
    train_rng_namespace: train-v3
    lexical_eval_rng_namespace: lexical-eval-v3
    composition_eval_rng_namespace: composition-eval-v3
    presence_eval_rng_namespace: presence-eval-v3
