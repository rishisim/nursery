  maximum_null_ablation_present_harm: 0.03
  minimum_active_presence_state_accuracy: 0.60
  minimum_oracle_presence_state_accuracy: 0.75
  maximum_cross_path_mean_top1_effect: 0.05
  presence_side_semantic_equivalence_margin: 0.03
  semantic_ablation_null_equivalence_margin: 0.03
  minimum_semantic_disconnect_endpoint_drop_lcb: 0.05
  minimum_side_semantic_mutation_drop_lcb: 0.03
  minimum_alignment_mutation_drop_lcb: 0.02
  minimum_null_update_disconnect_drop_lcb: 0.05
  null_update_semantic_equivalence_margin: 0.03
  minimum_presence_side_disconnect_drop_lcb: 0.05
  presence_null_effect_equality_tolerance: 1.0e-12
  minimum_synchronized_detector_lift_lcb: 0.10
  maximum_corrupted_detector_accuracy: 0.0
  minimum_distinct_action_geometry_digests: 12
  minimum_distinct_episode_geometry_digests: 12
  minimum_action_geometry_pairwise_distance_range: 0.02
  minimum_action_geometry_self_cross_dot_margin: 0.25
  minimum_distinct_heldout_split_digests: 8
  minimum_distinct_repetition_digests: 12
  minimum_distinct_ambiguity_strata: 3
  minimum_corpora_per_ambiguity_stratum: 2
  minimum_distinct_construction_factor_draws: 12
  minimum_distinct_candidate_count_histograms: 4
  minimum_distinct_grounded_episode_counts: 4
  minimum_realized_grounded_rate_range: 0.05
  minimum_realized_foil_rate_range: 0.05
  minimum_observed_lag_mean_range: 5.0
  minimum_realized_visibility_peak_range: 0.03
  minimum_realized_detector_accuracy_range: 0.05
  minimum_nonzero_within_corpus_model_metric_sd: 5.0e-4
  minimum_nonzero_continuous_model_variation_fraction: 0.50
  model_variation_gate_metrics: [lexical.multiclass_log_loss,
                                 composition.multiclass_log_loss,
                                 presence.multiclass_log_loss]
  model_variation_excluded_conditions: [oracle_alignment]
  model_variation_required_conditions: [synchronized, absent, shuffled]
  maximum_side_only_concept_accuracy_above_chance: 0.10
  exact_present_null_effect_vector_equality_forbidden: true

