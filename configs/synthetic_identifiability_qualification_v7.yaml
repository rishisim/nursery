design:
  action_concepts: 6
  noun_concepts: 6
  raw_samples: 72
  interval_width: 7
  conditions:
    - synchronized
    - randomized_shuffle
    - shift_minus_8
    - shift_plus_8
    - uninformative
    - absent_channel
    - sensor_corrupted
  detector_strata: [informative, weak, zero_information, corrupted]
  candidate_counts: [2, 3, 4, 5]
  action_distractor_cycles: 5
  noun_target_owner_pair_repetitions_per_sensor_stratum: 1
  target_presence_levels: [present, absent]
  action_visibility_levels: [0.55, 0.75, 1.0]
  lags: [-8, -4, 0, 4, 8]
  dropout_levels: [0.0, 0.25]
  noise_levels: [0.035, 0.14]
  false_positive_levels: [0, 1]
  time_shifts: [-8, 8]
  null_option: learnable
  null_parameterization: independently_learned_presence_mass
  candidate_count_normalized_alignment: true
  noun_exact_independence_strata: [noun_identity, candidate_count, grounding, sensor_stratum]
  action_exact_balance_strata: [action_identity, candidate_count, grounding, sensor_stratum]
  evaluation_candidate_order_policy: fractional_credit_across_exact_maxima

detector:
  frozen_v2_path: output/synthetic_sensor_event_robustness_v2/detector/frozen_detector.json
  frozen_v2_sha256: a487035deba4692728240eb593ba16e1182d9b5959b43d950b60883d1ed08b33
  required_class: babyworld_lite.sensor_alignment_v2.detector.SensorEventDetector
  required_function: babyworld_lite.sensor_alignment_v2.detector.candidate_evidence
  strata_capacity_bounds:
    informative: {minimum: 0.55, maximum: 1.0}
    weak: {minimum: 0.20, maximum: 0.95}
    zero_information: {minimum: 0.0, maximum: 0.70}
    corrupted: {minimum: 0.0, maximum: 0.70}
  overall_minimum: 0.25
  overall_maximum: 0.92

learner:
  name: factorized_presence_semantic_cross_situational_v7
  iterations: 10
  competition_weight: 0.55
  temperature: 0.55
  sensor_weight: 0.10
  sensor_null_calibration_weight: 0.0
  sensor_calibration_temperature: 1.0
  sensor_joint_update_weight: 0.0
  sensor_semantic_sharpening_weight: 0.50
  noun_sensor_weight: 0.0
  update_rate: 0.65
  smoothing: 0.04
  presence_smoothing: 0.50
  initial_presence_probability: 0.75
  initialization_jitter: 0.015
  lag_scale: 10.0
  token_joint_rule: geometric_mean_log_likelihood
  semantic_competition_excludes_presence_parameter: true
  candidate_count_normalization: false
  visible_cooccurrence_initialization: true
  cooccurrence_initialization_passes: 3
  null_margin_alpha: 0.80
  no_absence_null_mass: 1.0e-6

gates:
  minimum_present_fractional_margin_over_exact_chance: 0.15
  minimum_null_fractional_margin_over_exact_chance: 0.15
  minimum_present_probability_margin_over_exact_chance: 0.03
  minimum_null_probability_margin_over_exact_chance: 0.05
  minimum_log_loss_improvement_over_exact_chance: 0.05
  minimum_brier_improvement_over_exact_chance: 0.003
  maximum_tie_frequency: 0.25
  minimum_present_sensor_probability_delta: 0.005
  maximum_null_sensor_probability_harm: 0.02
  maximum_corrupted_sensor_probability_gain: 0.03
  minimum_null_ablation_fractional_drop: 0.20
  minimum_null_corruption_fractional_drop: 0.20
  minimum_oracle_fractional: 0.80
  minimum_direct_capacity_fractional: 0.95
  maximum_noun_sensor_application_count: 0
  maximum_noun_target_owner_gap: 0.0
  maximum_noun_target_owner_cramers_v: 0.0
  maximum_factor_pair_cramers_v: 0.20
  maximum_factor_control_cramers_v: 0.20
  order_metric_tolerance: 1.0e-12
  exact_tie_tolerance: 1.0e-12
  require_zero_development_outcomes: true
  require_zero_confirmation_outcomes: true

environment:
  python: .venv/bin/python
  version_test_root: tests/test_synthetic_identifiability_qualification_v7.py
  repository_test_root: tests
  bytecode_writes_disabled: true
