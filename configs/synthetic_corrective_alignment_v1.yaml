design:
  primitive_concepts: 4
  manner_concepts: 3
  action_compositions: 12
  held_out_compositions_per_corpus: 4
  training_repetitions_per_composition: [8, 14]
  candidate_event_count: [3, 5]
  raw_sensor_samples: 96
  event_width: [7, 12]
  event_gap: [4, 10]
  ambiguity_strata: [correction, ambiguous, recoverable]
  grounded_rate_range: [0.58, 0.82]
  foil_rate_by_stratum:
    correction: [0.88, 0.96]
    ambiguous: [0.70, 0.84]
    recoverable: [0.35, 0.55]
  visibility_range: [0.52, 0.90]
  lag_mean_range: [-12.0, 12.0]
  lag_sd_range: [3.0, 8.0]
  side_informativeness_range: [0.65, 0.92]
  side_noise_range: [0.04, 0.14]
  action_geometry:
    rng_namespace: action-geometry-v1
    off_diagonal_mass_range: [0.12, 0.24]
    minimum_self_cross_dot_margin: 0.25
    maximum_generation_attempts: 128
  grounded_sensor_peak_range: [1.6, 2.4]
  null_sensor_peak_range: [1.6, 2.4]
  signed_shift_samples: 13
  conditions: [synchronized, shuffled, shift_minus, shift_plus, absent,
               uninformative, corrupted, oracle_alignment, exact_window]
  negative_controls: [shuffled, shift_minus, shift_plus, absent, uninformative, corrupted]
  primary_comparators: [absent, shuffled]
  exact_window_comparator: exact_window
  positive_control: oracle_alignment
  mechanism_mutations: [semantic_side_zero, evidence_disconnected,
                        within_bag_permuted, old_agreement_gate,
                        semantic_update_disconnected, null_side_zero,
                        null_update_disconnected,
                        null_head_ablation]
  evaluation:
    held_out_instances_per_lexical_concept: 6
    held_out_instances_per_composition: 6
    presence_bags_per_composition: 4
    presence_bag_candidates: 4
    train_rng_namespace: train-v1
    lexical_eval_rng_namespace: lexical-eval-v1
    composition_eval_rng_namespace: composition-eval-v1
    presence_eval_rng_namespace: presence-eval-v1
    zero_exposure_tokens: 2
    side_modality_withheld: true

learner:
  name: corrective_event_null_stochastic_mil_v1
  epochs: 16
  language_weight: 1.0
  temporal_weight: 0.20
  temporal_scale: 12.0
  semantic_side_weight: 2.75
  null_side_weight: 2.75
  posterior_temperature: 0.55
  semantic_learning_rate: 0.16
  semantic_learning_rate_decay: 0.035
  null_learning_rate: 0.10
  initialization_concentration: 1.35
  smoothing: 0.025
  null_prior: 0.30
  null_mismatch_weight: 2.0
  exact_tie_tolerance: 1.0e-12

analysis:
  independent_unit: corpus_seed
  development_corpus_count: 100
  paired_model_replicates: 3
  model_replicate_handling: average_within_corpus_in_frozen_seed_order
  co_primary_endpoints: [lexical_acquisition_top1, heldout_composition_top1]
  comparator_definition: per_corpus_max_of_absent_and_shuffled
  intersection_union_rule: both_co_primary_estimands_must_pass_every_gate
  minimum_practical_effect: 0.10
  primary_one_sided_confidence_level: 0.95
  primary_lower_bound_must_exceed: 0.10
  synchronized_lcb_above_exact_chance: 0.20
  minimum_positive_corpus_fraction: 0.60
  maximum_large_negative_corpus_fraction: 0.20
  large_negative_threshold: -0.10
  all_identical_effects_fail: true
  primary_uncertainty: one_sided_student_t_over_corpus_means
  bootstrap_sensitivity_replicates: 20000
  secondary_metrics: [mean_rank, mrr, multiclass_log_loss, multiclass_brier,
                      tie_rate]
  secondary_multiplicity: descriptive_only_no_p_values_or_confirmatory_claims
  planning:
    true_mean_effect: 0.20
    null_margin: 0.10
    paired_corpus_sd: 0.30
    one_sided_alpha: 0.05
    per_endpoint_power: 0.952
    conjunctive_power_lower_bound: 0.904
    adaptive_extension: false

qualification_gates:
  construction_fixture_selection: preallocated_all_retained_no_search
  maximum_negative_control_top1: 0.80
  minimum_negative_control_wrong_or_tied_fraction: 0.20
  minimum_oracle_top1: 0.90
  minimum_oracle_lcb: 0.85
  minimum_oracle_lift_lcb: 0.15
  disagreement_case_count: 32
  minimum_active_disagreement_flip_fraction: 0.75
  maximum_mutated_disagreement_flip_fraction: 0.25
  minimum_hand_case_null_posterior: 0.90
  maximum_hand_case_null_semantic_update_l1: 0.02
  uninformative_equivalence_margin: 0.03
  equivalence_confidence_level: 0.90
  maximum_corrupted_gain_ucb: 0.03
  minimum_shift_lcb: 0.0
  minimum_informativeness_interaction_lcb: 0.10
  minimum_exact_window_high_lag_drop: 0.10
  minimum_latent_high_lag_recovery: 0.05
  minimum_null_ablation_drop: 0.10
  minimum_null_ablation_lcb: 0.05
  maximum_null_ablation_present_harm: 0.03
  semantic_ablation_null_equivalence_margin: 0.03
  minimum_semantic_disconnect_endpoint_drop_lcb: 0.05
  minimum_side_semantic_mutation_drop_lcb: 0.03
  minimum_alignment_mutation_drop_lcb: 0.02
  minimum_null_update_disconnect_drop_lcb: 0.05
  null_update_semantic_equivalence_margin: 0.03
  minimum_null_side_mutation_drop_lcb: 0.05
  null_side_semantic_equivalence_margin: 0.03
  presence_null_effect_equality_tolerance: 1.0e-12
  high_lag_rms_threshold: 8.0
  minimum_high_lag_corpus_count: 4
  minimum_low_lag_corpus_count: 4
  minimum_synchronized_detector_lift_lcb: 0.10
  maximum_corrupted_detector_accuracy: 0.0
  minimum_distinct_action_geometry_digests: 12
  minimum_distinct_episode_geometry_digests: 12
  minimum_action_geometry_pairwise_distance_range: 0.02
  minimum_action_geometry_self_cross_dot_margin: 0.25
  minimum_distinct_heldout_split_digests: 8
  minimum_distinct_repetition_digests: 12
  minimum_distinct_ambiguity_strata: 3
  minimum_distinct_candidate_count_histograms: 4
  minimum_distinct_grounded_episode_counts: 4
  minimum_realized_grounded_rate_range: 0.05
  minimum_realized_foil_rate_range: 0.05
  minimum_observed_lag_mean_range: 5.0
  minimum_realized_visibility_peak_range: 0.03
  minimum_realized_detector_accuracy_range: 0.05
  minimum_nonzero_within_corpus_model_metric_sd: 1.0e-6
  maximum_side_only_concept_accuracy_above_chance: 0.10
  exact_present_null_effect_vector_equality_forbidden: true

parallel:
  frozen_jobs: 4
  start_method: spawn
  bundle_unit: corpus_seed_x_model_seed_all_conditions
  one_inflight_model_per_corpus: true
  canonical_merge_order: corpus_then_model_then_condition
  worker_isolated_shards: true
  worker_isolated_tmp: true
  atomic_final_publish: true
  require_jobs_1_jobs_n_byte_identity: true
  minimum_benchmark_speedup: 1.20
  resource_contingency_multiplier: 1.50
  maximum_host_ram_fraction: 0.50
  maximum_current_free_disk_fraction: 0.50
  minimum_logical_cpu_count: 4
  thread_environment:
    PYTHONHASHSEED: "0"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    VECLIB_MAXIMUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    BLIS_NUM_THREADS: "1"

firewalls:
  forbidden_visible_fields: [answer_index, correct_candidate_id, concept_id,
                             intended_concept, oracle, oracle_alignment,
                             side_scores, side_stream, target_event_index,
                             training_side_evidence, event_logits, null_logit,
                             detector_input_present, positive_control,
                             exact_window, corruption, detector_feature,
                             detector_features, post_outcome]
  confirmation_command_exists: false
  confirmation_execution_supported: false
  development_output_must_be_pristine: true
  authorization_consumption_required: true
  authorization_replay_forbidden: true
  exact_manifest_file_set_required: true
  symlinks_forbidden_in_package_snapshot_shards_and_outputs: true

