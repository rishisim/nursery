environment:
  python: .venv/bin/python
  required_modules: [numpy, scipy, yaml, pytest, threadpoolctl]
  bytecode_writes_disabled: true

commands:
  development_argv: [run-development,
    --snapshot-root, output/synthetic_corrective_development_launch_package_v1/frozen_source_snapshot,
    --authorization, output/synthetic_corrective_development_launch_package_v1/launch_seal/CORRECTIVE_DEVELOPMENT_LAUNCH_READY.json,
    --output-root, output/synthetic_corrective_development_v1_one_shot,
    --jobs, "4"]
  development_one_shot: >-
    env PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 OMP_NUM_THREADS=1
    OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1
    NUMEXPR_NUM_THREADS=1 BLIS_NUM_THREADS=1 .venv/bin/python
    output/synthetic_corrective_development_launch_package_v1/frozen_source_snapshot/scripts/run_synthetic_corrective_alignment_v1.py
    run-development
    --snapshot-root output/synthetic_corrective_development_launch_package_v1/frozen_source_snapshot
    --authorization output/synthetic_corrective_development_launch_package_v1/launch_seal/CORRECTIVE_DEVELOPMENT_LAUNCH_READY.json
    --output-root output/synthetic_corrective_development_v1_one_shot
    --jobs 4
